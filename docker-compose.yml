# ============================================================================
#  Claude Phone für FreePBX  –  läuft auf docker.mrz.ip
# ============================================================================
#
#  Start:   cp .env.example .env   (Passwörter/Keys eintragen)
#           docker compose up -d --build
#
#  Aufbau:
#    1. TELEFONBUCH (configs.telefonbuch)  → welche Nebenstelle macht was
#    2. HOSTS       (im Telefonbuch)       → Rechner, die geprüft/geweckt werden
#    3. AGENTS      (./agents/<name>/)     → Eigenschaften der Claude-Instanzen
#
#  Neue Nebenstelle:  Eintrag unter "extensions:" + Passwort in .env,
#                     gleiche Nebenstelle in FreePBX als PJSIP-Extension anlegen,
#                     dann: docker compose up -d
#  Neuer Agent:       Ordner agents/<name>/ anlegen + Service "agent-<name>"
#                     nach Vorlage von agent-vermittlung unten.
# ============================================================================

configs:
  telefonbuch:
    content: |
      defaults:
        sip_domain: ${SIP_DOMAIN:-pbx.mrz.ip}
        voice: ${ELEVENLABS_VOICE_ID}

      # ── Rechner ──────────────────────────────────────────────────────────
      #  addresses   : alle Wege zum Rechner (IPs oder Hostnamen; Namen werden
      #                in alle IPs aufgelöst). Die erste Adresse, an der der
      #                claude-api-server antwortet, wird genommen.
      #  claude_port : Port des claude-api-servers auf dem Rechner
      #  probe       : TCP-Ports, an denen "Rechner ist an" erkannt wird
      #  wake        : Wake-on-LAN (Magic Packet an jede MAC, per UDP-Broadcast)
      hosts:
        julian-pc:
          name: Julians Rechner
          addresses:
            - julian-Precision-7560-3000.fritz.box   # Fritzbox-DNS: Kabel + WLAN, egal welche DHCP-IP
            - 192.168.188.201                        # WireGuard (wgprec2026), wenn unterwegs
          claude_port: 3333
          probe: [22]
          wake:
            macs:
              - 5c:85:7e:3e:f3:1e    # USB-/Dock-Ethernet
              - 08:92:04:46:4e:eb    # Onboard-Ethernet
            broadcast: 192.168.188.255
          boot_timeout: 180

      # ── Nebenstellen ─────────────────────────────────────────────────────
      #  type: operator    → Claude-Vermittlung, stellt per SIP-REFER durch
      #        host        → Rechner prüfen, ggf. wecken, dann dessen Claude
      #        claude      → direkt mit einer Claude-Instanz (agent: URL)
      #        placeholder → spricht "message" und legt auf
      extensions:
        "700":
          name: Vermittlung
          type: operator
          agent: http://127.0.0.1:3401          # → Service agent-vermittlung
          password: ${EXT_700_PASSWORD}
          description: Vermittlung, verbindet zu allen anderen Nebenstellen

        "701":
          name: Julians Rechner
          type: host
          host: julian-pc
          password: ${EXT_701_PASSWORD}
          description: Claude Code auf Julians Rechner. Weckt den Rechner bei Bedarf.

        "702":
          name: Netzwerk-Agent
          type: placeholder
          password: ${EXT_702_PASSWORD}
          description: Netzwerk-Agent (noch nicht eingerichtet)
          message: Der Netzwerk-Agent ist noch nicht eingerichtet. Bis bald!
          # später:  type: claude
          #          agent: http://127.0.0.1:3402   (→ Service agent-netzwerk)

        "703":
          name: Home Assistant
          type: claude
          agent: http://127.0.0.1:3403          # → Service agent-homeassistant
          password: ${EXT_703_PASSWORD}
          description: Haussteuerung – Licht, Heizung, Rollos, Temperaturen, Einkaufsliste
          greeting: Haussteuerung, hallo! Was kann ich für dich tun?

      # ── Weitere Ziele für die Vermittlung (normale Telefone etc.) ───────
      #  Werden nicht registriert, nur von 700 als Durchstell-Ziel genannt.
      directory: {}
        # "10": Julians Handy

services:
  # ── SIP / Media (Host-Netz zwingend, sonst kein RTP-Audio) ─────────────
  drachtio:
    image: drachtio/drachtio-server:latest
    restart: unless-stopped
    network_mode: host
    # transport=udp zuerst: FreePBX nimmt auf 5060 kein TCP an. Steht tcp vorn,
    # schickt drachtio Requests im Dialog (REFER fürs Durchstellen) per TCP → abgelehnt.
    command: >
      drachtio
      --contact "sip:*:${DRACHTIO_SIP_PORT:-5060};transport=udp,tcp"
      --external-ip ${EXTERNAL_IP}
      --secret ${DRACHTIO_SECRET:-cymru}
      --port 9022
      --loglevel info

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    restart: unless-stopped
    network_mode: host
    # SIP/RTP fest an EXTERNAL_IP binden. Sonst nimmt FreeSWITCH die IP der
    # ersten Default-Route – bei mehreren Netzwerkkarten oft die falsche,
    # dann "Connection refused" auf :5080 und Anrufe enden mit 503.
    entrypoint:
      - /bin/bash
      - -c
      - >-
        sed -i -E 's#name="(sip|rtp)-ip" value="[^"]*"#name="\1-ip" value="${EXTERNAL_IP}"#'
        /usr/local/freeswitch/conf/sip_profiles/mrf.xml
        && exec /entrypoint.sh "$$@"
      - --
    command: >
      freeswitch
      --sip-port 5080
      --rtp-range-start 30000
      --rtp-range-end 30100
      --ext-rtp-ip ${EXTERNAL_IP}
      --ext-sip-ip ${EXTERNAL_IP}
      --advertise-external-ip

  voice-app:
    build: ./voice-app
    restart: unless-stopped
    network_mode: host          # auch nötig für Wake-on-LAN-Broadcast
    env_file: .env
    environment:
      DRACHTIO_HOST: 127.0.0.1
      FREESWITCH_HOST: 127.0.0.1
      EXTENSIONS_CONFIG: /app/config/extensions.yml
      SIP_REGISTRAR: ${SIP_REGISTRAR}
    configs:
      - source: telefonbuch
        target: /app/config/extensions.yml
    volumes:
      - audio:/app/audio
      - data:/app/data          # zuletzt gewählte Ziele der Vermittlung
      - ./private:/app/private:ro  # Julians Adressbuch (contacts.vcf, NICHT im Git)
    depends_on: [drachtio, freeswitch]

  # ── Claude-Instanzen ────────────────────────────────────────────────────
  #  Jede Instanz = ein Ordner unter ./agents/ (CLAUDE.md = Persönlichkeit,
  #  .claude/settings.json = Rechte). Port nur lokal für die voice-app.
  agent-vermittlung:
    build:
      context: .
      dockerfile: claude-agent/Dockerfile
    restart: unless-stopped
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}   # Abo  (claude setup-token)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}               # oder API-Key (console.anthropic.com)
      CLAUDE_MODEL: claude-haiku-5-5     # schnell genug fürs Durchstellen
    volumes:
      - ./agents/vermittlung:/agent:ro
    ports:
      - "127.0.0.1:3401:3333"
    healthcheck:                         # "unhealthy", wenn der Claude-Zugang nicht klappt
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3333/health"]
      interval: 60s
      timeout: 15s
      start_period: 20s
      retries: 2

  agent-homeassistant:                   # Nebenstelle 703
    build:
      context: .
      dockerfile: claude-agent/Dockerfile
    restart: unless-stopped
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: claude-haiku-5-5
      # Harte Grenze: nur Werkzeuge aus agents/homeassistant/.claude/settings.json
      # (also nur bin/ha), das wiederum nur, was permissions.json erlaubt
      CLAUDE_SKIP_PERMISSIONS: "false"
      HA_URL: ${HA_URL:-http://ha.mrz.ip}
      HA_TOKEN: ${HA_TOKEN:-}
    volumes:
      - ./agents/homeassistant:/agent:ro
    ports:
      - "127.0.0.1:3403:3333"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3333/health"]
      interval: 60s
      timeout: 15s
      start_period: 20s
      retries: 2

  # agent-netzwerk:                      # für 702, später
  #   build: { context: ., dockerfile: claude-agent/Dockerfile }
  #   restart: unless-stopped
  #   environment:
  #     CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
  #     ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  #     CLAUDE_MODEL: claude-sonnet-5-5
  #   volumes:
  #     - ./agents/netzwerk:/agent
  #   ports:
  #     - "127.0.0.1:3402:3333"
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3333/health"]
  #     interval: 60s
  #     timeout: 15s
  #     start_period: 20s
  #     retries: 2

volumes:
  audio:
  data:
